spring.application.name=relay

# Database connection. Values come from environment variables; nothing is hardcoded.
# The application will not start until these are set (see README).
spring.datasource.url=jdbc:postgresql://localhost:5432/relay
spring.datasource.username=relay_app
spring.datasource.password=${DB_PASSWORD}

# Flyway: put versioned SQL files here, e.g. V1__create_events_table.sql
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
